<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 540" width="1280" height="540" role="img" aria-label="Abhilanshu — Full-Stack &amp; AI Developer">
  <title>Abhilanshu — Full-Stack &amp; AI Developer</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@400;600;800;900&amp;display=swap');
      
      .bg { fill: url(#bgGrad); }
      .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }

      .rec-dot {
        animation: blink 1.2s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.2; }
      }

      .typing-role {
        font-family: 'Fira Code', monospace;
        font-size: 26px;
        fill: #38bdf8;
        font-weight: 600;
      }

      .glow-title {
        font-size: 68px;
        font-weight: 900;
        fill: url(#textGrad);
        letter-spacing: -1.5px;
      }

      .card-border {
        stroke: #1e293b;
        stroke-width: 1.5;
        fill: none;
      }

      .grid-pattern {
        opacity: 0.12;
      }
    </style>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" class="grid-pattern">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background base -->
  <rect width="1280" height="540" rx="20" class="bg"/>
  <rect width="1280" height="540" rx="20" fill="url(#grid)"/>

  <!-- Futuristic Corner Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1250 60 L 1250 30 L 1220 30" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 30 480 L 30 510 L 60 510" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 1250 480 L 1250 510 L 1220 510" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>

  <!-- Top Status Bar -->
  <g transform="translate(50, 45)">
    <!-- REC Indicator -->
    <circle cx="12" cy="12" r="6" fill="#ef4444" class="rec-dot"/>
    <text x="26" y="16" fill="#f87171" class="font-mono" font-size="14" font-weight="700" letter-spacing="1">REC</text>

    <text x="80" y="16" fill="#94a3b8" class="font-mono" font-size="14">HELLO.MP4 · 60FPS</text>
    
    <!-- Open to collabs badge -->
    <g transform="translate(1000, 0)">
      <rect width="180" height="28" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <circle cx="16" cy="14" r="4" fill="#34d399" class="rec-dot"/>
      <text x="30" y="18" fill="#a7f3d0" class="font-mono" font-size="12" font-weight="600">OPEN TO COLLABS</text>
    </g>
  </g>

  <!-- Male Coder Avatar (Left Container) -->
  <g transform="translate(75, 110)">
    <!-- Backdrop Glow -->
    <rect width="360" height="370" rx="16" fill="url(#avatarGrad)" stroke="#312e81" stroke-width="2"/>
    
    <!-- Cyber Workstation & Male Developer Avatar -->
    <g transform="translate(20, 20)">
      <!-- Terminal Window Box -->
      <rect width="320" height="330" rx="12" fill="#0f172a" opacity="0.95"/>
      <circle cx="20" cy="20" r="5" fill="#ef4444"/>
      <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
      <circle cx="52" cy="20" r="5" fill="#10b981"/>
      <text x="280" y="24" fill="#475569" class="font-mono" font-size="12">dev.sh</text>
      <line x1="0" y1="36" x2="320" y2="36" stroke="#1e293b" stroke-width="1"/>

      <!-- Vector Male Coder Graphic -->
      <!-- Desk & Laptop -->
      <rect x="40" y="250" width="240" height="12" rx="4" fill="#334155"/>
      <path d="M 100 250 L 120 200 L 200 200 L 220 250 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect x="130" y="208" width="60" height="35" rx="3" fill="#0284c7" opacity="0.8"/>
      <!-- Code lines on laptop screen -->
      <line x1="136" y1="216" x2="175" y2="216" stroke="#e0f2fe" stroke-width="2"/>
      <line x1="136" y1="223" x2="160" y2="223" stroke="#38bdf8" stroke-width="2"/>
      <line x1="136" y1="230" x2="180" y2="230" stroke="#818cf8" stroke-width="2"/>

      <!-- Coder Silhouette / Body -->
      <!-- Shoulders & Hoodie -->
      <path d="M 80 250 C 80 170, 110 150, 160 150 C 210 150, 240 170, 240 250 Z" fill="#475569"/>
      <!-- Hoodie Inner Accent -->
      <path d="M 120 250 L 160 175 L 200 250 Z" fill="#1e293b"/>
      <line x1="160" y1="175" x2="160" y2="245" stroke="#38bdf8" stroke-width="2"/>

      <!-- Head & Hair (Short Male Haircut) -->
      <ellipse cx="160" cy="120" rx="36" ry="42" fill="#cbd5e1"/>
      <!-- Cool Haircut -->
      <path d="M 124 110 C 120 75, 140 60, 165 60 C 190 60, 200 75, 196 110 C 185 85, 140 85, 124 110 Z" fill="#0f172a"/>
      
      <!-- Tech Glasses / Visor -->
      <rect x="135" y="112" width="50" height="16" rx="4" fill="#0284c7" filter="url(#glow)"/>
      <line x1="138" y1="120" x2="182" y2="120" stroke="#ffffff" stroke-width="2"/>

      <!-- Headphones -->
      <path d="M 120 120 C 115 80, 205 80, 200 120" fill="none" stroke="#6366f1" stroke-width="6"/>
      <rect x="116" y="110" width="10" height="24" rx="4" fill="#818cf8"/>
      <rect x="194" y="110" width="10" height="24" rx="4" fill="#818cf8"/>

      <!-- Floating Code Sparks -->
      <text x="35" y="90" fill="#38bdf8" class="font-mono" font-size="14" font-weight="700">&lt;code/&gt;</text>
      <text x="235" y="100" fill="#a855f7" class="font-mono" font-size="14" font-weight="700">{ AI }</text>
      <text x="45" y="180" fill="#10b981" class="font-mono" font-size="12">def build():</text>
      <text x="230" y="170" fill="#f59e0b" class="font-mono" font-size="12">return True</text>
    </g>
  </g>

  <!-- Main Info Text Section (Right Container) -->
  <g transform="translate(480, 140)">
    <text x="0" y="30" fill="#94a3b8" class="font-mono" font-size="20" font-weight="600">Hi there, I'm 👋</text>
    
    <!-- Big Name -->
    <text x="0" y="105" class="font-inter glow-title">Abhilanshu</text>
    
    <!-- Subtitle / Role -->
    <g transform="translate(0, 150)">
      <text x="0" y="0" class="typing-role">&gt; Full-Stack &amp; AI Developer</text>
    </g>

    <!-- Bio Summary -->
    <g transform="translate(0, 195)">
      <text x="0" y="0" fill="#cbd5e1" class="font-inter" font-size="17">Building high-impact web applications, AI systems &amp; intelligent tools.</text>
      <text x="0" y="26" fill="#64748b" class="font-inter" font-size="15">Passionate about clean architecture, machine learning, and scalable backends.</text>
    </g>

    <!-- Tech Stack Pill Highlights -->
    <g transform="translate(0, 270)">
      <!-- Pill 1: Python -->
      <rect x="0" y="0" width="100" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
      <text x="50" y="22" fill="#60a5fa" class="font-mono" font-size="13" font-weight="600" text-anchor="middle">Python</text>

      <!-- Pill 2: JavaScript / React -->
      <rect x="112" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <text x="177" y="22" fill="#22d3ee" class="font-mono" font-size="13" font-weight="600" text-anchor="middle">React &amp; JS</text>

      <!-- Pill 3: FastAPI / Flask -->
      <rect x="254" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="319" y="22" fill="#34d399" class="font-mono" font-size="13" font-weight="600" text-anchor="middle">FastAPI / AI</text>

      <!-- Pill 4: Full Stack -->
      <rect x="396" y="0" width="120" height="34" rx="17" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="456" y="22" fill="#c084fc" class="font-mono" font-size="13" font-weight="600" text-anchor="middle">Full Stack</text>
    </g>
  </g>
</svg>