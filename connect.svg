<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Let's connect banner">
  <title>Let's connect</title>
  <defs>
    <linearGradient id="connectBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <linearGradient id="connectGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@400;600;700;800;900&amp;display=swap');
      
      .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }

      .card {
        fill: url(#connectBg);
        stroke: #1e293b;
        stroke-width: 2;
        rx: 16px;
      }

      .pulse {
        animation: pulseAnim 1.8s infinite;
      }
      @keyframes pulseAnim {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
    </style>
  </defs>

  <!-- Container -->
  <rect x="40" y="20" width="1200" height="280" class="card"/>
  <rect x="40" y="20" width="1200" height="4" fill="url(#connectGrad)" rx="2"/>

  <g transform="translate(80, 65)">
    <text x="0" y="0" class="font-mono" font-size="14" fill="#38bdf8" font-weight="700" letter-spacing="1.5">// LET'S CONNECT</text>
    <text x="0" y="36" class="font-inter" font-size="32" font-weight="900" fill="#f8fafc">Let's build something awesome together 🚀</text>
    <text x="0" y="72" class="font-inter" font-size="16" fill="#94a3b8">Open to full-stack collaborations, AI engineering roles, freelance projects &amp; tech discussions.</text>

    <!-- Interactive Badges Row inside SVG -->
    <g transform="translate(0, 115)">
      <!-- GitHub -->
      <rect x="0" y="0" width="240" height="50" rx="10" fill="#020617" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="28" cy="25" r="5" fill="#38bdf8" class="pulse"/>
      <text x="44" y="22" class="font-mono" font-size="11" fill="#64748b">GITHUB</text>
      <text x="44" y="38" class="font-inter" font-size="14" fill="#f8fafc" font-weight="700">@Abhilanshu</text>

      <!-- Email -->
      <rect x="260" y="0" width="280" height="50" rx="10" fill="#020617" stroke="#818cf8" stroke-width="1.5"/>
      <circle cx="288" cy="25" r="5" fill="#818cf8" class="pulse"/>
      <text x="304" y="22" class="font-mono" font-size="11" fill="#64748b">GET IN TOUCH</text>
      <text x="304" y="38" class="font-inter" font-size="14" fill="#f8fafc" font-weight="700">Abhilanshu (GitHub)</text>

      <!-- Status -->
      <rect x="560" y="0" width="280" height="50" rx="10" fill="#020617" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="588" cy="25" r="5" fill="#34d399" class="pulse"/>
      <text x="604" y="22" class="font-mono" font-size="11" fill="#64748b">AVAILABILITY</text>
      <text x="604" y="38" class="font-inter" font-size="14" fill="#34d399" font-weight="700">Open For Opportunities</text>
    </g>
  </g>
</svg>