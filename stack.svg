<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Tech Stack">
  <title>Tech Stack</title>
  <defs>
    <linearGradient id="stackCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@400;600;700;800&amp;display=swap');
      
      .font-inter { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .font-mono { font-family: 'Fira Code', monospace; }

      .card {
        fill: url(#stackCardBg);
        stroke: #1e293b;
        stroke-width: 2;
        rx: 16px;
      }

      .title-sub {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        font-weight: 700;
        fill: #38bdf8;
        letter-spacing: 1.5px;
      }

      .title-main {
        font-family: 'Inter', sans-serif;
        font-size: 26px;
        font-weight: 800;
        fill: #f8fafc;
      }

      .cat-title {
        font-family: 'Fira Code', monospace;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .pill {
        fill: #1e293b;
        stroke: #334155;
        stroke-width: 1.5;
        rx: 10px;
        transition: all 0.3s ease;
      }

      .pill-text {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #f1f5f9;
      }

      .icon {
        font-size: 16px;
      }
    </style>
  </defs>

  <!-- Main Card Container -->
  <rect x="40" y="20" width="1200" height="420" class="card"/>
  <rect x="40" y="20" width="1200" height="4" fill="url(#headerGrad)" rx="2"/>

  <!-- Title Header -->
  <g transform="translate(76, 65)">
    <text x="0" y="0" class="title-sub">// TECH STACK</text>
    <text x="0" y="30" class="title-main">Technologies &amp; Tools I Work With</text>
  </g>

  <!-- Categories Grid -->
  <!-- 1. FRONTEND -->
  <g transform="translate(76, 140)">
    <text x="0" y="0" class="cat-title" fill="#38bdf8">🌐 FRONTEND DEVELOPMENT</text>

    <!-- Pills Row 1 -->
    <g transform="translate(0, 15)">
      <!-- HTML5 -->
      <rect x="0" y="0" width="110" height="38" class="pill" stroke="#e34f26"/>
      <text x="14" y="24" class="icon">🧡</text>
      <text x="38" y="24" class="pill-text">HTML5</text>

      <!-- CSS3 -->
      <rect x="122" y="0" width="100" height="38" class="pill" stroke="#1572b6"/>
      <text x="136" y="24" class="icon">💙</text>
      <text x="160" y="24" class="pill-text">CSS3</text>

      <!-- JavaScript -->
      <rect x="234" y="0" width="135" height="38" class="pill" stroke="#f7df1e"/>
      <text x="248" y="24" class="icon">🟨</text>
      <text x="272" y="24" class="pill-text">JavaScript</text>

      <!-- TypeScript -->
      <rect x="381" y="0" width="135" height="38" class="pill" stroke="#3178c6"/>
      <text x="395" y="24" class="icon">🟦</text>
      <text x="419" y="24" class="pill-text">TypeScript</text>

      <!-- React -->
      <rect x="528" y="0" width="105" height="38" class="pill" stroke="#61dafb"/>
      <text x="542" y="24" class="icon">⚛️</text>
      <text x="566" y="24" class="pill-text">React</text>

      <!-- Tailwind CSS -->
      <rect x="645" y="0" width="140" height="38" class="pill" stroke="#06b6d4"/>
      <text x="659" y="24" class="icon">🎨</text>
      <text x="683" y="24" class="pill-text">Tailwind</text>
    </g>
  </g>

  <!-- 2. BACKEND & AI -->
  <g transform="translate(76, 235)">
    <text x="0" y="0" class="cat-title" fill="#818cf8">⚙️ BACKEND &amp; AI / ML ENGINE</text>

    <g transform="translate(0, 15)">
      <!-- Python -->
      <rect x="0" y="0" width="115" height="38" class="pill" stroke="#3776ab"/>
      <text x="14" y="24" class="icon">🐍</text>
      <text x="38" y="24" class="pill-text">Python</text>

      <!-- Node.js -->
      <rect x="127" y="0" width="115" height="38" class="pill" stroke="#339933"/>
      <text x="141" y="24" class="icon">🟢</text>
      <text x="165" y="24" class="pill-text">Node.js</text>

      <!-- FastAPI -->
      <rect x="254" y="0" width="115" height="38" class="pill" stroke="#009688"/>
      <text x="268" y="24" class="icon">⚡</text>
      <text x="292" y="24" class="pill-text">FastAPI</text>

      <!-- Flask -->
      <rect x="381" y="0" width="100" height="38" class="pill" stroke="#94a3b8"/>
      <text x="395" y="24" class="icon">🌶️</text>
      <text x="419" y="24" class="pill-text">Flask</text>

      <!-- REST APIs -->
      <rect x="493" y="0" width="130" height="38" class="pill" stroke="#a855f7"/>
      <text x="507" y="24" class="icon">🔗</text>
      <text x="531" y="24" class="pill-text">REST APIs</text>

      <!-- LLM & PyTorch -->
      <rect x="635" y="0" width="155" height="38" class="pill" stroke="#ee4c2c"/>
      <text x="649" y="24" class="icon">🤖</text>
      <text x="673" y="24" class="pill-text">AI / PyTorch</text>
    </g>
  </g>

  <!-- 3. DATABASES & DEVOPS -->
  <g transform="translate(76, 330)">
    <text x="0" y="0" class="cat-title" fill="#c084fc">🗄️ DATABASES, CLOUD &amp; DEVOPS</text>

    <g transform="translate(0, 15)">
      <!-- PostgreSQL -->
      <rect x="0" y="0" width="140" height="38" class="pill" stroke="#4169e1"/>
      <text x="14" y="24" class="icon">🐘</text>
      <text x="38" y="24" class="pill-text">PostgreSQL</text>

      <!-- MongoDB -->
      <rect x="152" y="0" width="125" height="38" class="pill" stroke="#47a248"/>
      <text x="166" y="24" class="icon">🍃</text>
      <text x="190" y="24" class="pill-text">MongoDB</text>

      <!-- Docker -->
      <rect x="289" y="0" width="115" height="38" class="pill" stroke="#2496ed"/>
      <text x="303" y="24" class="icon">🐳</text>
      <text x="327" y="24" class="pill-text">Docker</text>

      <!-- Git & GitHub -->
      <rect x="416" y="0" width="140" height="38" class="pill" stroke="#f05032"/>
      <text x="430" y="24" class="icon">🐙</text>
      <text x="454" y="24" class="pill-text">Git &amp; GitHub</text>

      <!-- Linux -->
      <rect x="568" y="0" width="105" height="38" class="pill" stroke="#fcc624"/>
      <text x="582" y="24" class="icon">🐧</text>
      <text x="606" y="24" class="pill-text">Linux</text>

      <!-- Postman / Vercel -->
      <rect x="685" y="0" width="130" height="38" class="pill" stroke="#ff6c37"/>
      <text x="699" y="24" class="icon">🚀</text>
      <text x="723" y="24" class="pill-text">Postman</text>
    </g>
  </g>
</svg>